<script>
window.QB = /*@@DATA@@*/;
/* ===== 通用小工具 C（和电路课同一套写法） =====
   C.el(tag, attrs, parent, text)   建 SVG 元素
   C.flow(parent, d, cls, speed, gap, r)   沿路径流动的小点（返回 {remove()}）
   C.tickers.add((t, dt) => {})     每帧回调（减少动画时不跑）
   C.pressOne(sel, attr, val)       一组按钮里只按下一个
   C.RM                             用户是否要求减少动画
   C.countUp(el, to, {dur, dec})    数字从 0 滚到 to（减少动画时直接显示）
   C.onVisible(el, fn, margin)      元素第一次进入视野时调用 fn
   C.h(tag, attrs, parent, html)    建 HTML 元素 */
(function () {
const NS = 'http://www.w3.org/2000/svg';
const RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const el = (tag, attrs, parent, text) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
};
const h = (tag, attrs, parent, html) => {
  const e = document.createElement(tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (html != null) e.innerHTML = html;
  if (parent) parent.appendChild(e);
  return e;
};
const flows = new Set();
function flow(parent, d, cls, speed, gap, r) {
  const p = el('path', { d, fill: 'none', stroke: 'none' }, parent);
  const len = p.getTotalLength();
  const n = Math.max(1, Math.round(len / gap));
  const dots = Array.from({ length: n }, () => el('circle', { r: r || 3.5, class: 'dot ' + (cls || '') }, parent));
  const f = { p, len, n, dots, speed, remove() { p.remove(); dots.forEach(x => x.remove()); flows.delete(f); } };
  flows.add(f); placeFlow(f, performance.now());
  return f;
}
function placeFlow(f, t) {
  for (let i = 0; i < f.n; i++) {
    const d = ((t / 1000) * f.speed + (i * f.len) / f.n) % f.len;
    const pt = f.p.getPointAtLength(d);
    f.dots[i].setAttribute('cx', pt.x.toFixed(1)); f.dots[i].setAttribute('cy', pt.y.toFixed(1));
  }
}
const tickers = new Set();
let last = performance.now();
function frame(t) {
  const dt = Math.min(0.1, (t - last) / 1000); last = t;
  flows.forEach(f => placeFlow(f, t));
  tickers.forEach(fn => fn(t, dt));
  requestAnimationFrame(frame);
}
if (!RM) requestAnimationFrame(frame);
const pressOne = (sel, attr, val) => document.querySelectorAll(sel).forEach(b => b.setAttribute('aria-pressed', String(b.dataset[attr] === String(val))));
function onVisible(target, fn, margin) {
  if (!('IntersectionObserver' in window)) { fn(); return; }
  const io = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) { io.disconnect(); fn(); } }, { rootMargin: margin || '0px' });
  io.observe(target);
}
function countUp(node, to, o) {
  o = Object.assign({ dur: 1.1, dec: 0 }, o || {});
  const fmt = v => v.toLocaleString('zh-CN', { minimumFractionDigits: o.dec, maximumFractionDigits: o.dec });
  if (RM) { node.textContent = fmt(to); return; }
  const t0 = performance.now();
  const step = now => {
    const q = Math.min(1, (now - t0) / (o.dur * 1000)), e = 1 - Math.pow(1 - q, 3);
    node.textContent = fmt(to * e);
    if (q < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
window.C = { el, h, flow, tickers, pressOne, RM, onVisible, countUp };
window.RM = RM;
})();
